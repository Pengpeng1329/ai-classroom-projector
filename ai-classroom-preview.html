<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2f4" />
  <title>渝小逻伴学：由 AI 伴学出题检验</title>
  <style>
    :root {
      --ink: #13202c;
      --muted: #5d6b77;
      --paper: #eef2f4;
      --surface: #ffffff;
      --line: #cdd7de;
      --blue: #1857c8;
      --blue-dark: #103d92;
      --blue-soft: #e9f1ff;
      --orange: #ef7a24;
      --yellow: #ffe566;
      --green: #16804d;
      --green-soft: #e9f8ef;
      --red: #c63a39;
      --red-soft: #fff0ef;
      --radius-stage: 18px;
      --radius-card: 12px;
      --radius-button: 10px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; min-height: 100%; }
    body {
      color: var(--ink);
      background: var(--paper);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 4px solid rgba(24, 87, 200, .3); outline-offset: 3px; }
    .shell { min-height: 100dvh; padding: 20px 24px 42px; }

    .classroom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1180px, calc(100% - 0px));
      min-height: 58px;
      margin: 0 auto 20px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 8px 24px rgba(29, 51, 68, .06);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: .01em; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--yellow);
      color: var(--blue-dark);
      font-weight: 950;
      font-size: 13px;
      box-shadow: inset 0 -3px 0 rgba(24, 87, 200, .16);
    }
    .class-meta { display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 14px; font-weight: 700; }
    .progress { color: var(--blue-dark); font-size: 17px; font-weight: 900; }

    .stage {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(28px, 4vw, 54px);
      border: 1px solid #d8e0e5;
      border-radius: var(--radius-stage);
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(28, 48, 64, .09);
    }
    .stage-top { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
    .eyebrow { margin: 0 0 8px; color: var(--orange); font-size: 15px; font-weight: 900; letter-spacing: .08em; }
    h1 { max-width: 760px; margin: 0; font-size: clamp(32px, 5vw, 64px); line-height: 1.08; letter-spacing: -.045em; }
    .stage-note { max-width: 300px; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; text-align: right; }

    .question-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(340px, .9fr); gap: 24px; align-items: start; }
    .argument-card { padding: clamp(22px, 3vw, 34px); border: 1px solid #e1e7eb; border-left: 8px solid var(--orange); border-radius: var(--radius-card); background: #fbfcfd; }
    .argument-label { margin-bottom: 16px; color: var(--muted); font-size: 14px; font-weight: 850; }
    .argument { margin: 0; font-size: clamp(22px, 3vw, 34px); line-height: 1.55; font-weight: 800; letter-spacing: -.025em; }
    .argument strong { color: var(--blue-dark); }
    .rule-chip { display: inline-flex; align-items: center; min-height: 36px; margin-top: 22px; padding: 0 12px; border-radius: 8px; background: var(--blue-soft); color: var(--blue-dark); font-size: 15px; font-weight: 850; }

    .decision-panel { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius-card); background: #f8fafb; }
    .decision-panel h2 { margin: 0 0 8px; font-size: 23px; }
    .decision-panel > p { margin: 0 0 18px; color: var(--muted); line-height: 1.55; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .choice {
      min-height: 86px;
      padding: 14px;
      border: 2px solid #c7d2da;
      border-radius: var(--radius-button);
      background: #fff;
      cursor: pointer;
      text-align: left;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, opacity .18s ease;
    }
    .choice:hover:not(:disabled) { border-color: var(--blue); transform: translateY(-2px); }
    .choice:active:not(:disabled) { transform: translateY(1px) scale(.985); }
    .choice strong { display: block; margin-bottom: 6px; font-size: 20px; }
    .choice span { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .choice.selected { border-color: var(--blue); background: var(--blue); color: #fff; }
    .choice.selected span { color: #dce8ff; }
    .choice:not(.selected):disabled { cursor: default; opacity: .48; }

    .ai-response { display: none; margin-top: 24px; overflow: hidden; border: 1px solid #c5d5ee; border-radius: var(--radius-card); background: #f8fbff; }
    .ai-response.visible { display: block; animation: appear .34s ease both; }
    .ai-response.correct { border-color: #9bc9af; background: var(--green-soft); }
    .ai-response.wrong { border-color: #e3aaaa; background: var(--red-soft); }
    .ai-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid rgba(24, 87, 200, .12); background: rgba(255, 255, 255, .56); }
    .ai-avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--blue); color: #fff; font-size: 12px; font-weight: 900; }
    .ai-head strong { font-size: 16px; }
    .ai-status { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 750; }
    .ai-body { padding: 18px; }
    .choice-echo { display: inline-flex; margin-bottom: 14px; padding: 8px 10px; border-radius: 8px; background: rgba(24, 87, 200, .1); color: var(--blue-dark); font-size: 14px; font-weight: 850; }
    .result { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 24px; font-weight: 950; }
    .result-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--green); color: #fff; font-size: 20px; }
    .wrong .result-mark { background: var(--red); }
    .ai-explanation { margin: 0; font-size: 18px; line-height: 1.72; }
    .ai-tip { margin: 16px 0 0; padding: 12px 14px; border-left: 4px solid var(--orange); background: rgba(255, 255, 255, .62); color: #42515c; font-size: 15px; line-height: 1.6; }

    .action-row { display: flex; justify-content: flex-end; min-height: 54px; margin-top: 24px; }
    .next-button { display: none; min-width: 150px; min-height: 54px; padding: 0 20px; border: 0; border-radius: var(--radius-button); background: var(--blue); color: #fff; cursor: pointer; font-weight: 900; box-shadow: 0 8px 16px rgba(24, 87, 200, .2); transition: transform .18s ease, background .18s ease; }
    .next-button.visible { display: inline-flex; align-items: center; justify-content: center; }
    .next-button:hover:not(:disabled) { background: var(--blue-dark); transform: translateY(-2px); }
    .next-button:active:not(:disabled) { transform: translateY(1px); }
    .next-button:disabled { cursor: default; background: #8d9aa4; box-shadow: none; }
    .footer-note { margin: 18px 0 0; color: #7a8790; font-size: 12px; text-align: center; }

    @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 760px) {
      .shell { padding: 12px 14px 28px; }
      .classroom-bar { margin-bottom: 12px; padding-inline: 12px; }
      .class-meta { gap: 10px; font-size: 12px; }
      .class-meta span:first-child { display: none; }
      .progress { font-size: 15px; }
      .stage { padding: 24px 18px 28px; }
      .stage-top { display: block; margin-bottom: 20px; }
      .stage-note { max-width: none; margin-top: 12px; text-align: left; }
      .question-layout { grid-template-columns: 1fr; gap: 16px; }
      .argument-card { border-left-width: 5px; padding: 20px 18px; }
      .argument { font-size: clamp(21px, 6vw, 28px); }
      .decision-panel { padding: 18px; }
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 70px; }
      .ai-explanation { font-size: 16px; }
      .action-row { justify-content: stretch; }
      .next-button, .next-button.visible { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="classroom-bar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">AI</span><span>渝小逻伴学</span></div>
      <div class="class-meta"><span>高二思想政治</span><span>逻辑判断练习</span><span class="progress" id="progressLabel">1 / 4</span></div>
    </header>

    <section class="stage" aria-label="逻辑判断课堂投屏">
      <div class="stage-top">
        <div>
          <p class="eyebrow">由 AI 伴学出题检验</p>
          <h1 id="questionTitle">先判断，再看 AI 怎么解释</h1>
        </div>
        <p class="stage-note" id="questionPrompt">请全班先判断这段推理能不能成立，再观察 AI 如何拆解前提和结论。</p>
      </div>

      <div class="question-layout">
        <article class="argument-card">
          <div class="argument-label">题目材料</div>
          <p class="argument" id="argumentText"></p>
          <div class="rule-chip" id="ruleLabel"></div>
        </article>

        <section class="decision-panel" aria-labelledby="decisionHeading">
          <h2 id="decisionHeading">这是什么式？</h2>
          <p>点击你的判断。页面会用一段预设的 AI 对话解释理由。</p>
          <div class="choices" role="group" aria-label="选择推理类型">
            <button class="choice" type="button" data-answer="有效式"><strong>有效式</strong><span>前提能够支持结论</span></button>
            <button class="choice" type="button" data-answer="无效式"><strong>无效式</strong><span>前提不能必然推出结论</span></button>
          </div>
        </section>
      </div>

      <section class="ai-response" id="aiResponse" aria-live="polite" aria-atomic="true">
        <div class="ai-head"><span class="ai-avatar" aria-hidden="true">AI</span><strong>AI 伴学正在回应</strong><span class="ai-status" id="aiStatus">正在检查这个推理</span></div>
        <div class="ai-body">
          <div class="choice-echo" id="choiceEcho"></div>
          <div class="result"><span class="result-mark" id="resultMark">✓</span><span id="resultLabel">判断正确</span></div>
          <p class="ai-explanation" id="aiExplanation"></p>
          <p class="ai-tip" id="aiTip"></p>
        </div>
      </section>

      <div class="action-row"><button class="next-button" id="nextButton" type="button">下一题</button></div>
      <p class="footer-note">本页为课堂演示版。AI 反馈由本地预设内容模拟，不连接真实模型。</p>
    </section>
  </main>

  <script>
    const QUESTION_BANK = [
      {
        id: 1,
        title: '否定一个景点，能推出另一个吗？',
        prompt: '请根据题干给出的游览安排，判断这个结论能不能必然推出。',
        argument: '小米来重庆旅游，或者游览洪崖洞，或者打卡解放碑。小米没有去洪崖洞，所以，小米去打卡了解放碑。',
        answer: '有效式',
        rule: '观察提示：区分旅行背景和两个选言支',
        correctExplanation: '这个判断是对的。“来重庆旅游”是背景，两个选言支是“游览洪崖洞”和“打卡解放碑”。前提要求至少一项成立，否定“游览洪崖洞”后，就能肯定“打卡解放碑”。这是相容选言推理的否定肯定式。',
        wrongExplanation: '本题是有效式。“来重庆旅游”不是第三个选项。相容选言的两项可以同时为真，但在“洪崖洞或解放碑”这一前提下，否定洪崖洞后，解放碑就必须成立。',
        tip: '相容选言推理｜有效式：否定肯定式。两个选言支中，否定一项，可以肯定另一项。'
      },
      {
        id: 2,
        title: '选择自驾，能排除旅游大巴吗？',
        prompt: '留意括号里的“只选一种主力交通”，再判断结论。',
        argument: '本次出行去仙女山，要么自驾，要么坐旅游大巴（只选一种主力交通）。我已经选择了自驾，所以我没有坐旅游大巴。',
        answer: '有效式',
        rule: '观察提示：两种主力交通能否同时选择',
        correctExplanation: '这个判断是对的。题干明确规定自驾和旅游大巴只选一种，两个选言支不能同时为真。既然已经选择自驾，就可以否定“坐旅游大巴”。这是不相容选言推理的肯定否定式。',
        wrongExplanation: '本题是有效式。关键是题干明确限定“只选一种主力交通”，所以自驾和旅游大巴相互排斥。肯定自驾，就能否定旅游大巴。',
        tip: '不相容选言推理｜有效式：肯定否定式。肯定一个选言支，可以否定其余选言支。'
      },
      {
        id: 3,
        title: '用了手机扫码，能排除其他支付方式吗？',
        prompt: '题干是否明确说只能使用一种支付方式？请根据前提判断。',
        argument: '重庆居民在解放碑商圈消费时，支付方式或者是刷银行卡，或者是用手机扫码，或者是使用现金。小张在解放碑购物时用了手机扫码支付，所以小张没有刷银行卡，也没有使用现金。',
        answer: '无效式',
        rule: '观察提示：确认一种支付方式，是否排除了其他方式',
        correctExplanation: '这个判断是对的。题干没有规定只能选择一种支付方式，几种方式可以并存。小张用了手机扫码，并不能排除他购物时还刷了银行卡或使用现金。相容选言推理的肯定否定式是无效式。',
        wrongExplanation: '本题是无效式。“用了手机扫码”只说明这一项成立，无法证明其他项不成立。题干没有“只选一种”的限制，例如不同商品可以分别使用扫码和现金支付。',
        tip: '相容选言推理｜无效式：肯定否定式。肯定一个选言支，不能据此否定其他选言支。'
      },
      {
        id: 4,
        title: '没有坐轨道交通，能推出机场快线吗？',
        prompt: '按题干“要么……要么……”给出的两种出行方案进行判断。',
        argument: '从重庆江北机场到解放碑，要么坐轨道交通10号线转2号线，要么坐机场快线K01路。小李没有坐轨道交通，所以小李坐了机场快线K01路。',
        answer: '有效式',
        rule: '观察提示：在题干给定的二选一前提下分析',
        correctExplanation: '这个判断是对的。在题干给定的二选一前提下，轨道交通方案和机场快线方案必须有一项成立。小李没有坐轨道交通，就排除了第一项，因此能推出他坐了机场快线K01路。这是不相容选言推理的否定肯定式。',
        wrongExplanation: '本题是有效式。逻辑判断以题干给定的前提为依据：“要么……要么……”限定两种方案。否定轨道交通方案后，可以肯定机场快线方案，不需要额外引入题干以外的出行方式。',
        tip: '不相容选言推理｜有效式：否定肯定式。否定一个选言支，可以肯定剩下的另一个选言支。'
      }
    ];

    const progressLabel = document.getElementById('progressLabel');
    const questionTitle = document.getElementById('questionTitle');
    const questionPrompt = document.getElementById('questionPrompt');
    const argumentText = document.getElementById('argumentText');
    const ruleLabel = document.getElementById('ruleLabel');
    const choices = Array.from(document.querySelectorAll('[data-answer]'));
    const aiResponse = document.getElementById('aiResponse');
    const aiStatus = document.getElementById('aiStatus');
    const choiceEcho = document.getElementById('choiceEcho');
    const resultLabel = document.getElementById('resultLabel');
    const resultMark = document.getElementById('resultMark');
    const aiExplanation = document.getElementById('aiExplanation');
    const aiTip = document.getElementById('aiTip');
    const nextButton = document.getElementById('nextButton');

    let currentQuestionIndex = 0;
    let selectedAnswer = '';
    let isExplaining = false;
    let explanationTimer = null;

    function renderQuestion(index) {
      if (explanationTimer) window.clearTimeout(explanationTimer);
      const question = QUESTION_BANK[index];
      currentQuestionIndex = index;
      selectedAnswer = '';
      isExplaining = false;
      progressLabel.textContent = `${question.id} / ${QUESTION_BANK.length}`;
      questionTitle.textContent = question.title;
      questionPrompt.textContent = question.prompt;
      argumentText.textContent = question.argument;
      ruleLabel.textContent = question.rule;
      choices.forEach((choice) => { choice.disabled = false; choice.classList.remove('selected'); });
      aiResponse.className = 'ai-response';
      aiStatus.textContent = '正在检查这个推理';
      choiceEcho.textContent = '';
      resultLabel.textContent = '判断正确';
      resultMark.textContent = '✓';
      aiExplanation.textContent = '';
      aiTip.textContent = '';
      nextButton.classList.remove('visible');
      nextButton.disabled = index === QUESTION_BANK.length - 1;
      nextButton.textContent = index === QUESTION_BANK.length - 1 ? '本题完成' : '下一题';
    }

    function handleAnswer(answer) {
      if (isExplaining) return;
      selectedAnswer = answer;
      isExplaining = true;
      choices.forEach((choice) => { choice.disabled = true; choice.classList.toggle('selected', choice.dataset.answer === answer); });
      choiceEcho.textContent = `课堂选择：${answer}`;
      aiResponse.className = 'ai-response visible';
      aiStatus.textContent = '正在检查这个推理';
      aiExplanation.textContent = '';
      aiTip.textContent = '';
      explanationTimer = window.setTimeout(showExplanation, 700);
    }

    function showExplanation() {
      const question = QUESTION_BANK[currentQuestionIndex];
      const isCorrect = selectedAnswer === question.answer;
      aiResponse.className = `ai-response visible ${isCorrect ? 'correct' : 'wrong'}`;
      aiStatus.textContent = isCorrect ? '已完成分析' : '发现一个需要修正的地方';
      resultLabel.textContent = isCorrect ? '判断正确' : '再检查一次';
      resultMark.textContent = isCorrect ? '✓' : '×';
      aiExplanation.textContent = isCorrect ? question.correctExplanation : question.wrongExplanation;
      aiTip.textContent = question.tip;
      if (currentQuestionIndex < QUESTION_BANK.length - 1) nextButton.classList.add('visible');
      aiResponse.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    choices.forEach((choice) => choice.addEventListener('click', () => handleAnswer(choice.dataset.answer)));
    nextButton.addEventListener('click', () => {
      if (nextButton.disabled || currentQuestionIndex >= QUESTION_BANK.length - 1) return;
      renderQuestion(currentQuestionIndex + 1);
    });

    renderQuestion(0);
  </script>
</body>
</html>
